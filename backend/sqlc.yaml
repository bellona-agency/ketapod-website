version: "2"
sql:
  - engine: postgresql
    queries: internal/identity/queries
    schema: migrations
    gen:
      go:
        package: sqlcgen
        out: internal/identity/sqlcgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"

